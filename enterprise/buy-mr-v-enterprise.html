<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy Mr V Enterprise</title>
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#0b1226;--mut:#64748b;--line:#dbe4f3;--blue:#2563eb;--blue2:#1d4ed8;--gold:#f59e0b;--ok:#16a34a;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#e6efff,#f6f9ff 60%)}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:420px;height:420px;background:#93c5fd;left:-120px;top:-100px}
.blobs i:nth-child(2){width:360px;height:360px;background:#fde68a;right:-100px;top:140px;animation-delay:-6s}
.blobs i:nth-child(3){width:380px;height:380px;background:#c4b5fd;left:30%;bottom:-180px;animation-delay:-11s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
header{display:flex;align-items:center;gap:12px;padding:16px 22px;max-width:1080px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font:900 28px/1 Inter,system-ui;box-shadow:0 8px 20px rgba(37,99,235,.4);flex:none}
header b{font-size:1.15rem}header small{display:block;color:var(--mut);margin-top:-3px}header .sp{flex:1}
.link{background:#fff;border:1px solid var(--line);border-radius:99px;color:var(--blue2);font:inherit;font-weight:700;cursor:pointer;padding:8px 16px;transition:.2s}.link:hover{background:#eff6ff;transform:translateY(-1px)}
main{max-width:1080px;margin:0 auto;padding:6px 20px 70px}
.page{animation:pin .55s var(--ease) both}.page.rev{animation-name:pinr}
@keyframes pin{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pinr{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.st>*{animation:pin .6s var(--ease) both}.st>*:nth-child(2){animation-delay:.08s}.st>*:nth-child(3){animation-delay:.16s}.st>*:nth-child(4){animation-delay:.24s}.st>*:nth-child(5){animation-delay:.32s}
.hero{text-align:center;padding:26px 0 10px}
.kick{display:inline-block;color:var(--blue2);background:#dbeafe;font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:5px 14px}
h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.08;margin:14px 0 10px;letter-spacing:-.02em}
h2{margin:0 0 6px;font-size:1.35rem}.mut{color:var(--mut)}.small{font-size:.92rem}p{margin:0 0 12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px;gap:4px;margin:20px 0 6px;box-shadow:0 6px 20px rgba(30,64,175,.08);position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;font:inherit;font-weight:800;color:var(--mut);padding:10px 22px;border-radius:99px;cursor:pointer;transition:color .25s}
.seg button.on{color:#fff}.seg .pill{position:absolute;top:5px;bottom:5px;border-radius:99px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);transition:left .35s var(--ease),width .35s var(--ease);box-shadow:0 6px 14px rgba(37,99,235,.35)}
.seg small{display:block;font-size:.65rem;font-weight:700;opacity:.8;margin-top:-4px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.plan{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px;cursor:pointer;font:inherit;color:inherit;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;overflow:hidden}
.plan:hover{transform:translateY(-8px);box-shadow:0 26px 50px rgba(30,64,175,.18);border-color:#93b4f5}
.plan:active{transform:translateY(-3px) scale(.99)}
.plan.plus{border-color:#fcd34d;background:linear-gradient(160deg,#fffdf5,#fff7d6)}.plan.plus:hover{border-color:var(--gold);box-shadow:0 26px 50px rgba(217,119,6,.25)}
.plan.plus:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.plan .ico{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:2rem;background:#dbeafe;margin-bottom:14px;transition:transform .4s var(--ease)}.plan:hover .ico{transform:rotate(-8deg) scale(1.12)}
.plan.plus .ico{background:#fde68a}
.plan h2{font-size:1.5rem}.tag{font-size:.7rem;font-weight:800;border-radius:99px;padding:3px 10px;margin-left:8px;vertical-align:middle;background:#fde68a;color:#78350f}
.price{font-size:3.2rem;font-weight:900;line-height:1;margin:12px 0 2px;letter-spacing:-.03em}.price.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.14);color:var(--blue)}}
.price small{font-size:1rem;font-weight:700;color:var(--mut);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:16px 0 20px}.plan li{padding:5px 0 5px 28px;position:relative}.plan li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:900}
.go{display:block;text-align:center;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border-radius:16px;font-weight:800;padding:14px;transition:.25s;box-shadow:0 10px 22px rgba(37,99,235,.3)}
.plus .go{background:linear-gradient(135deg,#fbbf24,#d97706);box-shadow:0 10px 22px rgba(217,119,6,.35)}
.plan:hover .go{letter-spacing:.03em}
.fine{text-align:center;margin-top:22px}
/* pay page */
.back{border:0;background:none;color:var(--blue2);font:inherit;font-weight:800;cursor:pointer;padding:8px 0;margin-bottom:6px}.back:hover{text-decoration:underline}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 14px 40px rgba(30,64,175,.09)}
.sticky{position:sticky;top:16px}
.opts{display:grid;gap:12px;margin:16px 0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);border-radius:20px;padding:16px 18px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:.25s var(--ease)}
.opt:hover{border-color:#93b4f5;transform:translateX(5px)}
.opt.on{border-color:var(--blue);background:#eff6ff;box-shadow:0 0 0 5px rgba(37,99,235,.12)}
.opt .ic{font-size:1.9rem;width:48px;text-align:center;flex:none}.opt .t b{display:block}.opt .t>span{color:var(--mut);font-size:.9rem;line-height:1.35;display:block}
.chip{font-size:.68rem;font-weight:800;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle;background:#bbf7d0;color:#14532d}.chip.r{background:#fecdd3;color:#881337}
.warn,.good{border-radius:16px;padding:12px 14px;font-size:.93rem;margin:12px 0;animation:pin .4s var(--ease)}
.warn{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.good{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
input[type=text]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;margin-top:6px;transition:.2s}input[type=text]:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}.row:last-of-type{border:0}
.big{font-size:3rem;font-weight:900;line-height:1;letter-spacing:-.03em;margin:8px 0 4px}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:1.08rem;border:0;border-radius:16px;padding:16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 12px 26px rgba(37,99,235,.35);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s;position:relative;overflow:hidden}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 30px rgba(37,99,235,.45)}.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.btn.light{background:#e8efff;color:var(--blue2);box-shadow:none}.btn.gold{background:linear-gradient(135deg,#fbbf24,#d97706);box-shadow:0 12px 26px rgba(217,119,6,.35)}
.cd{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.7);transition:width 1s linear}
button:focus-visible{outline:3px solid #93b4f5;outline-offset:3px}
/* order page */
.pend{text-align:center;background:linear-gradient(160deg,#fffbeb,#fef3c7);border:2px solid #fcd34d;border-radius:28px;padding:30px 20px;position:relative;overflow:hidden}
.pend .ck{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:#fbbf24;display:grid;place-items:center;font-size:2.4rem;animation:ring 2.2s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}50%{box-shadow:0 0 0 18px rgba(251,191,36,0)}}
.pend.ok{background:linear-gradient(160deg,#f0fdf4,#dcfce7);border-color:#86efac}.pend.ok .ck{background:#22c55e;animation:none;color:#fff}
.status{display:flex;margin:26px 0 8px}.status div{flex:1;text-align:center;font-size:.8rem;color:var(--mut);position:relative;padding-top:30px}
.status div:before{content:"";position:absolute;top:6px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#cbd5e1;z-index:2;transition:.4s}
.status div:after{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#cbd5e1}.status div:first-child:after{display:none}
.status .d:before,.status .d:after{background:var(--ok)}.status .d{color:var(--ink);font-weight:700}
.status .c:before{background:var(--blue);animation:ring2 1.8s infinite}.status .c{color:var(--ink);font-weight:800}.status .c:after{background:var(--ok)}
@keyframes ring2{50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}}
.env{position:relative;width:min(100%,360px);margin:10px auto 6px;aspect-ratio:1.55;background:linear-gradient(160deg,#fef3c7,#fde68a);border:2px solid #d97706;border-radius:14px;box-shadow:0 14px 30px rgba(180,83,9,.22);overflow:hidden;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-.6deg)}}
.env .fl{position:absolute;left:0;right:0;top:0;height:55%;clip-path:polygon(0 0,100% 0,50% 100%);background:#fbbf24}
.env .seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#dc2626;color:#fff;display:grid;place-items:center;font:900 23px Inter,system-ui;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.env .lab{position:absolute;left:6%;right:6%;bottom:7%;font-size:.85rem;color:#78350f;text-align:center;line-height:1.25}.env .lab b{font-size:1.7rem;display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}.steps li{counter-increment:s;position:relative;padding:7px 0 7px 42px;min-height:42px}
.steps li:before{content:counter(s);position:absolute;left:0;top:6px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}td a{color:var(--blue2);font-weight:800}
.pill2{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700;background:#fef3c7;color:#92400e}.pill2.c{background:#dcfce7;color:#166534}
/* the spinning V for EVERYTHING */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,rgba(244,248,255,.96),rgba(219,234,254,.97));backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#load.on{opacity:1;visibility:visible}
#load .v{width:116px;height:116px;border-radius:34px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font:900 80px/1 Inter,system-ui;box-shadow:0 22px 46px rgba(37,99,235,.45);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load b{font-size:1.25rem}#load small{color:var(--mut);letter-spacing:.18em;text-transform:uppercase;font-weight:700}
#load .bar{width:180px;height:6px;border-radius:9px;background:#cfe0fb;overflow:hidden}#load .bar i{display:block;height:100%;width:40%;background:var(--blue);border-radius:9px;animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
/* notification ask */
#nmod{position:fixed;inset:0;z-index:90;background:rgba(11,18,38,.45);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#nmod .box{background:#fff;border-radius:28px;padding:30px 26px;max-width:430px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pin .5s var(--ease)}
#nmod .bell{font-size:3rem;display:inline-block;animation:bell 1.6s ease-in-out infinite;transform-origin:top center}
@keyframes bell{0%,40%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,35%{transform:rotate(-14deg)}}
#nmod .site{font-weight:800;color:var(--blue2)}
#nmod .btn+.btn{margin-top:10px}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:max-content;background:#0b1226;color:#fff;padding:13px 20px;border-radius:14px;z-index:120;max-width:90vw;box-shadow:0 14px 30px rgba(0,0,0,.3);animation:pin .35s var(--ease)}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:110;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media(max-width:820px){.plans,.two{grid-template-columns:1fr}.sticky{position:static}.price{font-size:2.6rem}.panel{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}#load .v{animation:spin 2.4s linear infinite!important}}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}.dots i{width:44px;height:7px;border-radius:9px;background:#d3def2;transition:.4s}.dots i.d{background:var(--blue)}
.cap{text-align:center;color:var(--mut);font-weight:700;font-size:.85rem;margin-bottom:4px}
.narrow{max-width:620px;margin:0 auto}
.opt.lg{padding:20px 22px}.opt.lg .pr{margin-left:auto;font-size:1.6rem;font-weight:900;white-space:nowrap}
.opt.off{opacity:.55;cursor:not-allowed}.opt.off:hover{transform:none;border-color:var(--line)}
.opt .t b{font-size:1.1rem}
</style></head><body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<header><div class="logo" aria-hidden="true">V</div><div><b>Mr V Enterprise</b><small>vandernoth.com</small></div><div class="sp"></div><button class="link" id="ordersb">My orders</button></header>
<main id="app"></main>
<p class="mut small" style="text-align:center;margin:-40px 0 50px">Owner? <a href="index.html" style="color:#1d4ed8;font-weight:700">Log in on the website</a> to see requests and give subscriptions.</p>
<div id="load" role="status" aria-label="Loading"><div class="v">V</div><b id="loadt">Loading…</b><div class="bar"><i></i></div></div>
<div id="nmod" class="hide" role="dialog" aria-modal="true" aria-labelledby="nt"></div>
<div id="toast" class="hide" role="status"></div>
<script>
const PR={e:{7:.99,30:2.99,90:6.99},p:{7:1.49,30:4.99,90:11.99}},NAME={e:'Enterprise',p:'Enterprise+'},ICON={e:'⭐',p:'👑'};
const FEAT={e:['All Mr V Enterprise features','Works on every device'],p:['Everything in Enterprise','Extra Enterprise+ features']};
const METH={envelope:'Envelope',cash:'Cash in person',card:'Card (secure link)'};
const $=id=>document.getElementById(id),money=n=>'$'+n.toFixed(2),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY='mrv_buy_orders',NK='mrv_buy_notif',LK='mrv_buy_last',ORDER_COOL=5,SITE='vandernoth.com';
const SESS=(()=>{try{return JSON.parse(localStorage.getItem('mrv_sess'))}catch(e){return null}})(),SID=SESS&&SESS.role==='student'?SESS.id:'';
let FB='',PAYLINK='';
const fbReady=(async()=>{try{const r=await fetch('firebase.txt?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const u=(await r.text()).trim().split(/\s+/)[0];if(/^https?:\/\/\S+$/.test(u)&&!/YOUR/i.test(u)){FB=u.replace(/\/+$/,'');const c=await fetch(FB+'/cls.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);if(c&&/^https:\/\/\S+$/.test(c.paylink||''))PAYLINK=c.paylink}}catch(e){}})();
const fbPut=o=>fetch(FB+'/orders/'+o.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>{if(!r.ok)throw new Error('save')});
const fbGet=id=>fetch(FB+'/orders/'+id+'.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
const pub=o=>({id:o.id,sid:SID,role:SID?'student':'guest',name:o.name,plan:o.plan,days:o.days,total:o.total,method:o.method,state:o.state==='claimed'?'given':o.state,ts:o.ts});
let S={plan:'',dur:30,method:'',name:ls.g('mrv_buy_name','')},view='plan',cur=null,busy=false,rev=false;
const FLOW=['plan','length','method','review'];

/* the spinning V: on EVERYTHING */
function withLoad(text,fn,ms){
  if(busy)return;busy=true;$('loadt').textContent=text||'Loading…';$('load').classList.add('on');
  setTimeout(()=>{Promise.resolve().then(fn).catch(()=>{}).finally(()=>{setTimeout(()=>{$('load').classList.remove('on');busy=false},180)})},ms||800);
}
const CD={};function cool(k,ms){const n=Date.now();if(CD[k]&&n-CD[k]<ms)return false;CD[k]=n;return true}
function toast(t){const x=$('toast');x.classList.remove('hide');x.style.animation='none';x.offsetWidth;x.style.animation='';x.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add('hide'),4500)}
function notify(t,b){if(ls.g(NK,'')==='on'&&window.Notification&&Notification.permission==='granted'){try{new Notification(t,{body:b||''})}catch(e){}}toast(t+(b?(/[!?.]$/.test(t)?' ':'. ')+b:''))}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<70;i++){const c=document.createElement('i');c.className='cf';c.style.cssText='left:'+Math.random()*100+'vw;background:hsl('+Math.floor(Math.random()*360)+',85%,60%);animation-duration:'+(1.6+Math.random()*1.6)+'s;animation-delay:'+Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
const orders=()=>ls.g(KEY,[]),code=()=>'MV-'+Math.random().toString(36).slice(2,6).toUpperCase();
const expDate=d=>new Date(Date.now()+d*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});

/* notification ask */
function askNotif(){
  $('nmod').innerHTML='<div class="box"><div class="bell" aria-hidden="true">🔔</div><h2 id="nt" style="margin-top:8px">Turn on notifications?</h2><p class="mut">Let <span class="site">'+SITE+'</span> send you reminders when your order is coming or claimed.</p><p class="mut small">It is optional. Your browser will ask you to confirm.</p><button class="btn" id="nyes">Allow notifications</button><button class="btn light" id="nno">Not now</button></div>';
  $('nmod').classList.remove('hide');setTimeout(()=>$('nyes').focus(),50);
}
function notifDone(v){$('nmod').classList.add('hide');ls.s(NK,v);if(v!=='on')setTimeout(()=>toast('Notifications are off. You will not get order updates, so check this page yourself.'),400)}
function notifYes(){if(!window.Notification){notifDone('off');return}Notification.requestPermission().then(r=>{if(r==='granted'){notifDone('on');toast('Notifications are on. Thanks!')}else notifDone('off')}).catch(()=>notifDone('off'))}

/* ---------- the stages ---------- */
const dots=n=>'<div class="dots" aria-label="Step '+n+' of 4">'+[1,2,3,4].map(i=>'<i class="'+(i<=n?'d':'')+'"></i>').join('')+'</div><div class="cap">Step '+n+' of 4</div>';
const back=(to,l)=>'<button class="back" data-back="'+to+'">← '+l+'</button>';
const opt=(a,v,ic,t,sub,right,cls,off)=>'<button class="opt lg '+(cls||'')+(off?' off':'')+'" data-'+a+'="'+v+'"'+(off?' disabled':'')+'><span class="ic" aria-hidden="true">'+ic+'</span><span class="t"><b>'+t+'</b><span>'+sub+'</span></span>'+(right?'<span class="pr">'+right+'</span>':'')+'</button>';
const V={
 plan(){return '<div class="narrow st">'+dots(1)+'<div class="hero" style="padding-top:12px"><h1>Choose your plan</h1><p class="mut">Tap the one you want.</p></div><div class="opts">'+
   opt('plan','e','⭐','Enterprise',FEAT.e.join(' · '),'from $0.99')+opt('plan','p','👑','Enterprise+ <span class="chip g">MORE</span>',FEAT.p.join(' · '),'from $1.49','gold')+'</div></div>'},
 length(){return '<div class="narrow st">'+back('plan','Change plan')+dots(2)+'<div class="hero" style="padding-top:12px"><h1>How long?</h1><p class="mut">When should your '+NAME[S.plan]+' expire?</p></div><div class="opts">'+
   [7,30,90].map(d=>opt('dur',d,d===7?'📅':d===30?'🗓️':'📆',d+' days'+(d===30?' <span class="chip">DEFAULT</span>':''),'Expires '+expDate(d),money(PR[S.plan][d]),S.plan==='p'?'gold':'')).join('')+'</div></div>'},
 method(){return '<div class="narrow st">'+back('length','Change length')+dots(3)+'<div class="hero" style="padding-top:12px"><h1>How will you pay?</h1><p class="mut">One payment of <b>'+money(PR[S.plan][S.dur])+'</b>.</p></div><div class="opts">'+
   opt('m','envelope','✉️','Envelope <span class="chip">RECOMMENDED</span>','Put the money in an envelope and take it to Mr V\'s room.')+
   opt('m','cash','💵','Cash in person','Hand your cash straight to Mr V.')+
   opt('m','card','💳','Credit or debit card',PAYLINK?'Pay on a secure card page. Your card info goes to the payment company, never to this site.':'Not set up yet. Ask Mr V to turn it on.','','',!PAYLINK)+'</div></div>'},
 review(){const t=PR[S.plan][S.dur],env=Math.ceil(t);
  return '<div class="narrow st">'+back('method','Change payment')+dots(4)+'<div class="hero" style="padding-top:12px"><h1>Check and pay</h1></div><div class="panel"><div class="row"><span>Plan</span><b>'+ICON[S.plan]+' '+NAME[S.plan]+'</b></div><div class="row"><span>Length</span><b>'+S.dur+' days</b></div><div class="row"><span>Expires</span><b>'+expDate(S.dur)+'</b></div><div class="row"><span>Pay with</span><b>'+METH[S.method]+'</b></div>'+
   '<div class="mut small" style="margin-top:12px">Total</div><div class="big">'+money(t)+'</div>'+
   (S.method==='envelope'?'<div class="good">Put <b>$'+env+'</b> in your envelope (rounded up to a whole dollar).</div>':S.method==='cash'?'<div class="good">Bring <b>$'+env+'</b> in cash and hand it to Mr V.</div>':'<div class="good">A secure card page opens in a new tab. Pay <b>'+money(t)+'</b> there.</div>')+
   '<label class="small mut" for="nm">Your name</label><input type="text" id="nm" maxlength="40" placeholder="First name and last initial" autocomplete="off" value="'+esc(S.name)+'">'+
   '<button class="btn '+(S.plan==='p'?'gold':'')+'" id="payb" style="margin-top:16px">Pay Mr V Enterprise<i class="cd" id="cdbar" style="width:0"></i></button><p class="small mut" id="cdtxt" style="text-align:center;margin:10px 0 0"></p></div></div>'}
};
const STG=[['pending','Pending'],['sent','Sent'],['got','Received'],['claimed','Claimed']];
function order(o){
  const cu=STG.findIndex(s=>s[0]===o.state),p=Math.ceil(o.total),ok=o.state==='claimed',no=o.state==='cancelled';
  const how=o.method==='envelope'?'<h2>Make your envelope</h2><div class="env"><div class="fl"></div><div class="seal">V</div><div class="lab">For Mr V · Room<br><b>$'+p+'</b>'+esc(o.name)+' · '+o.id+'</div></div><ol class="steps"><li>Put <b>$'+p+'</b> in an envelope.</li><li>Write your name and <b>'+o.id+'</b> on the front.</li><li>Take it to Mr V\'s room.</li><li>Press the button below.</li></ol>':
   o.method==='cash'?'<h2>Pay in cash</h2><ol class="steps"><li>Find Mr V and say your order code <b>'+o.id+'</b>.</li><li>Hand him <b>$'+p+'</b> in cash.</li><li>Press the button below.</li></ol>':
   '<h2>Pay by card</h2><ol class="steps"><li>Press <b>Open card payment</b>.</li><li>Pay <b>'+money(o.total)+'</b> on the secure page. Type <b>'+o.id+'</b> in the note box if it asks.</li><li>Come back and press the button below.</li></ol>'+(PAYLINK?'<a class="btn" style="text-align:center;text-decoration:none;margin-bottom:10px" href="'+esc(PAYLINK)+'" target="_blank" rel="noopener">Open card payment</a>':'');
  return '<div class="two st"><div class="panel"><div class="pend '+(ok?'ok':'')+'" '+(no?'style="background:#f1f5f9;border-color:#cbd5e1"':'')+'><div class="ck" aria-hidden="true" '+(no?'style="background:#94a3b8;animation:none"':'')+'>'+(ok?'✓':no?'✕':'⏳')+'</div><h1 style="font-size:2rem;margin:0 0 6px">'+(ok?'Plan claimed!':no?'Order cancelled':'Payment pending')+'</h1><p style="margin:0"><b>'+(ok?'Enjoy '+NAME[o.plan]+'!':no?'Mr V cancelled this order. Nothing was given.':'Thanks for shopping with us.')+'</b></p><p class="mut small" style="margin:6px 0 0">'+ICON[o.plan]+' '+NAME[o.plan]+' · '+o.days+' days · '+money(o.total)+' · '+o.id+'</p></div>'+
  (no?'':'<div class="status">'+STG.map((s,i)=>'<div class="'+(i<cu||ok?'d':i===cu?'c':'')+'">'+s[1]+'</div>').join('')+'</div>')+
  (ok||no?'':'<p class="mut small" style="text-align:center">Your plan is claimed about 1 to 8 hours after Mr V gets your payment, or sooner.</p>')+(FB?'':'<div class="warn">Offline: this order is saved on this device only, so Mr V can not see it yet.</div>')+
  '</div><div class="panel">'+(no?'<h2>This order was cancelled</h2><p class="mut">You can order again any time.</p>':ok?'<h2>All done</h2><p class="mut">Your plan expires on <b>'+expDate(o.days)+'</b>.</p>':how+'<button class="btn" id="sentb" data-id="'+o.id+'"'+(o.state!=='pending'?' disabled':'')+'>'+(o.state==='pending'?'I sent my payment':'Payment marked as sent')+'</button>')+
  '<button class="btn light" id="again" style="margin-top:10px">Buy another plan</button></div></div>';
}
function history(){const L=orders();return '<div class="hero"><span class="kick">History</span><h1>My orders</h1><p class="mut small">Saved in this browser only.</p></div><div class="panel st">'+(L.length?'<table><tr><th>Code</th><th>Plan</th><th>Total</th><th>Status</th></tr>'+L.map(o=>'<tr><td><a href="#" data-open="'+o.id+'">'+o.id+'</a></td><td>'+NAME[o.plan]+' '+o.days+'d</td><td>'+money(o.total)+'</td><td><span class="pill2 '+(o.state==='claimed'?'c':'')+'">'+({pending:'Pending',sent:'Sent',got:'Received',claimed:'Claimed',cancelled:'Cancelled'})[o.state]+'</span></td></tr>').join('')+'</table>':'<p class="mut" style="text-align:center;padding:30px 0">No orders yet.</p>')+'<button class="btn" id="again" style="margin-top:14px">Browse plans</button></div>'}

function draw(){
  const a=$('app');a.innerHTML='<div class="page '+(rev?'rev':'')+'">'+(view==='order'?order(cur):view==='history'?history():V[view]())+'</div>';rev=false;scrollTo(0,0);
  if(view==='review')cdTick();
}
function nav(v,text,fn,bk){withLoad(text,()=>{if(fn)fn();view=v;rev=!!bk;draw()},700)}
function cdLeft(){return Math.max(0,Math.ceil(ORDER_COOL-(Date.now()-ls.g(LK,0))/1000))}
function cdTick(){clearTimeout(cdTick.t);const b=$('payb');if(!b)return;const l=cdLeft();b.disabled=l>0;$('cdbar').style.width=(l>0?l/ORDER_COOL*100:0)+'%';$('cdtxt').textContent=l>0?'Please wait '+l+' seconds before another order.':'';if(l>0)cdTick.t=setTimeout(cdTick,1000)}

document.addEventListener('click',e=>{
  const t=e.target;let b;if(busy)return;
  if(t.id==='nyes'){if(cool('n',800))withLoad('Asking your browser…',notifYes,600);return}
  if(t.id==='nno'){if(cool('n',800))withLoad('Saving…',()=>notifDone('off'),500);return}
  if(b=t.closest('[data-plan]')){if(cool('s',900))nav('length','Next…',()=>{S.plan=b.dataset.plan});return}
  if(b=t.closest('[data-dur]')){if(cool('s',900))nav('method','Next…',()=>{S.dur=+b.dataset.dur});return}
  if(b=t.closest('[data-m]')){if(cool('s',900))nav('review','Next…',()=>{S.method=b.dataset.m});return}
  if(b=t.closest('[data-back]')){if(cool('s',900))nav(b.dataset.back,'Going back…',null,true);return}
  if(t.id==='payb'){
    const n=$('nm').value.trim();if(!n){$('nm').focus();toast('Type your name first.');return}
    if(cdLeft()>0||!cool('pay',3000))return;
    S.name=n;ls.s('mrv_buy_name',n);
    const o={id:code(),name:n,plan:S.plan,days:S.dur,total:PR[S.plan][S.dur],method:S.method,ts:Date.now(),state:'pending'};
    const prev=ls.g(LK,0);ls.s(LK,Date.now());
    withLoad('Paying Mr V Enterprise…',async()=>{
      await fbReady;
      if(FB){try{await fbPut(pub(o))}catch(err){ls.s(LK,prev);toast('Could not send your order to Mr V. Check your internet and try again.');return}}
      const L=orders();L.unshift(o);ls.s(KEY,L);cur=o;view='order';draw();notify('Payment pending','Thanks for shopping with us. Order '+o.id)},2400);return}
  if(t.id==='again'){if(cool('ag',900))nav('plan','Loading plans…');return}
  if(t.id==='ordersb'){if(cool('ob',900))nav('history','Loading your orders…');return}
  if(b=t.closest('[data-open]')){e.preventDefault();const o=orders().find(x=>x.id===b.dataset.open);if(o&&cool('op',900))nav('order','Opening order…',()=>{cur=o});return}
  if(t.id==='sentb'){if(cool('sent',3000))upd(t.dataset.id,'Telling Mr V…',async o=>{o.state='sent';if(FB){try{await fbPut(pub(o))}catch(err){toast('Saved here, but could not reach Mr V yet.')}}notify('Payment marked as sent','Mr V will get it soon.')});return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'&&$('payb'))$('payb').click();if(e.key==='Escape'&&!$('nmod').classList.contains('hide'))$('nno').click()});
document.addEventListener('input',e=>{if(e.target.id==='nm')S.name=e.target.value});
function upd(id,text,fn){const L=orders(),o=L.find(x=>x.id===id);if(!o)return;withLoad(text,async()=>{await fn(o);ls.s(KEY,L);cur=o;draw()},800)}
async function syncOrders(){
  await fbReady;if(!FB||busy)return;const L=orders();let ch=false;
  for(const o of L){if(o.state==='claimed'||o.state==='cancelled')continue;
    try{const r=await fbGet(o.id);if(!r)continue;
      if(r.state==='given'){o.state='claimed';ch=true;notify('Plan claimed!',NAME[o.plan]+' is yours for '+o.days+' days.');setTimeout(confetti,400)}
      else if(r.state==='cancelled'){o.state='cancelled';ch=true;notify('Order cancelled','Mr V cancelled order '+o.id)}}catch(e){}}
  if(ch){ls.s(KEY,L);if(view==='order'&&cur)cur=L.find(x=>x.id===cur.id)||cur;if(!FLOW.includes(view))draw()}
}
setInterval(syncOrders,6000);
$('ordersb').onclick=()=>{if(!busy&&cool('ob',900))nav('history','Loading your orders…')};
withLoad('Loading Mr V Enterprise…',async()=>{await fbReady;draw();if(!ls.g(NK,''))setTimeout(askNotif,500)},1000);
</script></body></html>
