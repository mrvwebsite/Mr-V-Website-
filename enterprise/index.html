<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy Mr V Enterprise</title>
<style>
/* ============ design tokens ============ */
:root{
  --bg:#f3f7ff; --card:#ffffff; --soft:#f1f5fd; --ink:#0b1226; --mut:#64748b; --line:#dbe4f3;
  --blue:#2563eb; --blue2:#1d4ed8; --blueSoft:#e8efff; --gold:#f59e0b; --goldSoft:#fffbeb;
  --ok:#16a34a; --okSoft:#f0fdf4; --bad:#e11d48; --badSoft:#fff1f2;
  --shadow:0 14px 40px rgba(30,64,175,.10); --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=dark]{
  --bg:#0b1020; --card:#131a2e; --soft:#1a2340; --ink:#eaf0ff; --mut:#9aa8c7; --line:#27335a;
  --blueSoft:#1b2a55; --goldSoft:#2a2210; --okSoft:#10261a; --badSoft:#2a1019;
  --shadow:0 14px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0 0 12px}
.mut{color:var(--mut)} .small{font-size:.9rem} .hide{display:none!important}
:focus-visible{outline:3px solid #93b4f5;outline-offset:3px}

/* ============ background ============ */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#e6efff,var(--bg) 60%)}
[data-theme=dark] .blobs{background:linear-gradient(180deg,#0f1630,var(--bg) 60%)}
.blobs i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:420px;height:420px;background:#93c5fd;left:-120px;top:-100px}
.blobs i:nth-child(2){width:360px;height:360px;background:#fde68a;right:-100px;top:140px;animation-delay:-6s}
.blobs i:nth-child(3){width:380px;height:380px;background:#c4b5fd;left:30%;bottom:-180px;animation-delay:-11s}
[data-theme=dark] .blobs i{opacity:.22}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}

/* ============ header ============ */
header{display:flex;align-items:center;gap:10px;padding:14px 22px;max-width:1160px;margin:0 auto;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font:900 28px/1 Inter,system-ui;box-shadow:0 8px 20px rgba(37,99,235,.4);flex:none}
header b{font-size:1.15rem} header small{display:block;color:var(--mut);margin-top:-3px}
header .sp{flex:1}
.hbtn{background:var(--card);border:1px solid var(--line);border-radius:99px;color:var(--blue2);font-weight:700;cursor:pointer;padding:8px 15px;transition:.2s;font-size:.92rem}
[data-theme=dark] .hbtn{color:#9db9ff}
.hbtn:hover{background:var(--blueSoft);transform:translateY(-1px)}

/* ============ layout ============ */
main{max-width:1160px;margin:0 auto;padding:6px 20px 90px}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.shell.solo{grid-template-columns:minmax(0,1fr)}
.page{animation:pin .5s var(--ease) both} .page.rev{animation-name:pinr}
@keyframes pin{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pinr{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.stagger>*{animation:pin .55s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.14s}.stagger>*:nth-child(4){animation-delay:.21s}.stagger>*:nth-child(5){animation-delay:.28s}

/* ============ stepper ============ */
.stepper{display:flex;gap:6px;margin:2px 0 18px;overflow-x:auto;padding:4px 2px}
.stp{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--mut);position:relative;text-align:center}
.stp:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.stp:first-child:before{display:none}
.stp i{width:32px;height:32px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;z-index:1;transition:.35s var(--ease)}
.stp.d{color:var(--ink)} .stp.d i{background:var(--ok);border-color:var(--ok);color:#fff} .stp.d:before{background:var(--ok)}
.stp.c{color:var(--ink)} .stp.c i{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 6px rgba(37,99,235,.18)} .stp.c:before{background:var(--ok)}
.stp.jmp{cursor:pointer}

/* ============ cards ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}
.hero{padding:6px 0 14px}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);margin:8px 0 6px}
.kick{display:inline-block;color:var(--blue2);background:var(--blueSoft);font-weight:800;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:5px 14px}
.back{border:0;background:none;color:var(--blue2);font-weight:800;cursor:pointer;padding:6px 0;margin-bottom:4px}
[data-theme=dark] .back{color:#9db9ff}
.back:hover{text-decoration:underline}

/* option cards */
.opts{display:grid;gap:12px;margin:16px 0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);border-radius:20px;padding:18px 20px;background:var(--card);cursor:pointer;transition:.25s var(--ease);position:relative;overflow:hidden}
.opt:hover:not(:disabled){border-color:#93b4f5;transform:translateX(5px)}
.opt.on{border-color:var(--blue);background:var(--blueSoft);box-shadow:0 0 0 5px rgba(37,99,235,.12)}
.opt.gold.on{border-color:var(--gold);background:var(--goldSoft);box-shadow:0 0 0 5px rgba(245,158,11,.16)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.opt .ic{font-size:1.9rem;width:48px;text-align:center;flex:none}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:1.1rem}
.opt .t>span{display:block;color:var(--mut);font-size:.9rem;line-height:1.35}
.opt .pr{font-size:1.6rem;font-weight:900;white-space:nowrap}
.chip{font-size:.68rem;font-weight:800;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle;background:#bbf7d0;color:#14532d}
.chip.g{background:#fde68a;color:#78350f} .chip.b{background:#bfdbfe;color:#1e3a8a}

/* plan hero cards */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
.plan{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:26px;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;overflow:hidden}
.plan:hover{transform:translateY(-8px);box-shadow:0 26px 50px rgba(30,64,175,.18);border-color:#93b4f5}
.plan.plus{border-color:#fcd34d;background:linear-gradient(160deg,var(--card),var(--goldSoft))}
.plan.plus:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.plan .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;background:var(--blueSoft);margin-bottom:12px}
.plan.plus .ico{background:#fde68a}
.plan .price{font-size:2.7rem;font-weight:900;line-height:1;margin:10px 0 2px}
.plan ul{list-style:none;padding:0;margin:14px 0 18px}
.plan li{padding:4px 0 4px 26px;position:relative;font-size:.95rem}
.plan li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:900}
.go{display:block;text-align:center;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border-radius:15px;font-weight:800;padding:13px}
.plus .go{background:linear-gradient(135deg,#fbbf24,#d97706)}

/* ============ forms ============ */
label.lab{display:block;font-weight:700;font-size:.88rem;margin:16px 0 4px;color:var(--mut)}
input[type=text],select,textarea{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);transition:.2s}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.inrow{display:flex;gap:10px}.inrow input{flex:1}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:16px;margin:14px 0;cursor:pointer;transition:.2s}
.check:has(input:checked){border-color:var(--ok);background:var(--okSoft)}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:var(--card);font-weight:700;transition:.2s}
.slot.on{border-color:var(--blue);background:var(--blueSoft)}
.slot small{display:block;color:var(--mut);font-weight:500}
.good,.warn,.info{border-radius:16px;padding:12px 14px;font-size:.93rem;margin:12px 0;animation:pin .4s var(--ease)}
.good{background:var(--okSoft);border:1px solid #86efac;color:#166534}
.warn{background:var(--badSoft);border:1px solid #fecdd3;color:#be123c}
.info{background:var(--blueSoft);border:1px solid #bfdbfe;color:#1e40af}
[data-theme=dark] .good{color:#86efac} [data-theme=dark] .warn{color:#fda4af} [data-theme=dark] .info{color:#bfdbfe}

/* ============ buttons ============ */
.btn{display:block;width:100%;font-weight:800;font-size:1.05rem;border:0;border-radius:16px;padding:15px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 12px 26px rgba(37,99,235,.35);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s;position:relative;overflow:hidden;text-align:center;text-decoration:none}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 30px rgba(37,99,235,.45)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.light{background:var(--blueSoft);color:var(--blue2);box-shadow:none} [data-theme=dark] .btn.light{color:#9db9ff}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#d97706);box-shadow:0 12px 26px rgba(217,119,6,.35)}
.btn.red{background:var(--badSoft);color:var(--bad);box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:.9rem;border-radius:12px}
.btnrow{display:flex;gap:10px;margin-top:14px} .btnrow .btn{flex:1}
.cd{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.7);transition:width 1s linear}

/* ============ order summary sidebar ============ */
.side{position:sticky;top:14px}
.sum .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.sum .row:last-of-type{border:0}
.sum .row span:first-child{color:var(--mut)}
.sum .save{color:var(--ok);font-weight:800}
.big{font-size:2.8rem;font-weight:900;line-height:1;letter-spacing:-.03em;margin:6px 0 2px}
.was{text-decoration:line-through;color:var(--mut);font-size:1rem;margin-left:8px;font-weight:600;letter-spacing:0}
.empty{color:var(--mut);text-align:center;padding:10px 0}

/* ============ order page ============ */
.pend{text-align:center;background:linear-gradient(160deg,var(--goldSoft),#fef3c7);border:2px solid #fcd34d;border-radius:26px;padding:28px 18px}
[data-theme=dark] .pend{background:linear-gradient(160deg,#2a2210,#241c0c);border-color:#7c5a0c}
.pend .ck{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;background:#fbbf24;display:grid;place-items:center;font-size:2.3rem;animation:ring 2.2s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}50%{box-shadow:0 0 0 18px rgba(251,191,36,0)}}
.pend.ok{background:linear-gradient(160deg,var(--okSoft),#dcfce7);border-color:#86efac} [data-theme=dark] .pend.ok{background:var(--okSoft);border-color:#1f7a45}
.pend.ok .ck{background:#22c55e;animation:none;color:#fff}
.pend.no{background:var(--soft);border-color:var(--line)} .pend.no .ck{background:#94a3b8;animation:none;color:#fff}
.tl{list-style:none;padding:0;margin:20px 0 4px;position:relative}
.tl:before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:3px;background:var(--line)}
.tl li{position:relative;padding:6px 0 14px 42px}
.tl li:before{content:"";position:absolute;left:5px;top:9px;width:19px;height:19px;border-radius:50%;background:var(--ok);border:3px solid var(--card);box-shadow:0 0 0 2px var(--ok)}
.tl li.next:before{background:var(--card);box-shadow:0 0 0 2px var(--line)}
.tl li.now:before{background:var(--blue);box-shadow:0 0 0 2px var(--blue);animation:ring2 1.8s infinite}
@keyframes ring2{0%{box-shadow:0 0 0 2px var(--blue),0 0 0 0 rgba(37,99,235,.5)}100%{box-shadow:0 0 0 2px var(--blue),0 0 0 12px rgba(37,99,235,0)}}
.tl b{display:block} .tl small{color:var(--mut)}
.eta{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0}
.eta i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width 1s}
.env{position:relative;width:min(100%,340px);margin:10px auto;aspect-ratio:1.55;background:linear-gradient(160deg,#fef3c7,#fde68a);border:2px solid #d97706;border-radius:14px;box-shadow:0 14px 30px rgba(180,83,9,.22);overflow:hidden;animation:float 4s ease-in-out infinite;color:#78350f}
@keyframes float{50%{transform:translateY(-8px) rotate(-.6deg)}}
.env .fl{position:absolute;left:0;right:0;top:0;height:55%;clip-path:polygon(0 0,100% 0,50% 100%);background:#fbbf24}
.env .seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#dc2626;color:#fff;display:grid;place-items:center;font:900 23px Inter,system-ui;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.env .lab{position:absolute;left:6%;right:6%;bottom:7%;font-size:.82rem;text-align:center;line-height:1.25}
.env .lab b{font-size:1.6rem;display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}
.steps li{counter-increment:s;position:relative;padding:7px 0 7px 42px;min-height:42px}
.steps li:before{content:counter(s);position:absolute;left:0;top:6px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border:2px dashed var(--line);border-radius:16px;padding:12px 16px;margin:12px 0}
.codebox b{font-size:1.4rem;letter-spacing:.08em}

/* ============ history ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{font-size:1.6rem;display:block;line-height:1.1}.stat small{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-weight:700;cursor:pointer;font-size:.9rem}
.fchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ocard{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;background:var(--card);cursor:pointer;transition:.2s}
.ocard:hover{border-color:#93b4f5;transform:translateX(4px)}
.pill2{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;background:#fef3c7;color:#92400e}
.pill2.c{background:#dcfce7;color:#166534} .pill2.x{background:#e2e8f0;color:#475569} .pill2.s{background:#dbeafe;color:#1e40af}

/* ============ overlays ============ */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,rgba(244,248,255,.96),rgba(219,234,254,.97));backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
[data-theme=dark] #load{background:linear-gradient(135deg,rgba(11,16,32,.96),rgba(19,26,46,.97))}
#load.on{opacity:1;visibility:visible}
#load .v{width:116px;height:116px;border-radius:34px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font:900 80px/1 Inter,system-ui;box-shadow:0 22px 46px rgba(37,99,235,.45);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load b{font-size:1.25rem}
#load .bar{width:180px;height:6px;border-radius:9px;background:#cfe0fb;overflow:hidden}
#load .bar i{display:block;height:100%;width:40%;background:var(--blue);border-radius:9px;animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.modal{position:fixed;inset:0;z-index:90;background:rgba(11,18,38,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--card);border-radius:28px;padding:28px 24px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pin .45s var(--ease)}
.modal .box.wide{max-width:680px}
.modal .x{float:right;border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer}
.bell{font-size:3rem;display:inline-block;animation:bell 1.6s ease-in-out infinite;transform-origin:top center}
@keyframes bell{0%,40%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,35%{transform:rotate(-14deg)}}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.93rem;vertical-align:top}
th{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
details.faq{border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0;background:var(--card)}
details.faq summary{cursor:pointer;font-weight:700} details.faq[open]{border-color:var(--blue)}
details.faq p{margin:8px 0 0;color:var(--mut)}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;background:#fff;color:#111;border:1px dashed #999;border-radius:12px;padding:18px}
.receipt h3{text-align:center;margin-bottom:6px} .receipt .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.receipt hr{border:0;border-top:1px dashed #999;margin:10px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:max-content;background:#0b1226;color:#fff;padding:13px 20px;border-radius:14px;z-index:120;max-width:90vw;box-shadow:0 14px 30px rgba(0,0,0,.3);animation:pin .35s var(--ease)}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:110;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.mbar{display:none}

/* ============ responsive + print + motion ============ */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}.side{position:static;order:-1}.plans{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}.panel{padding:20px}
}
@media(max-width:560px){.stp span{display:none}.stp{min-width:44px}.slots{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
@media print{
  body *{visibility:hidden} .receipt,.receipt *{visibility:visible} .receipt{position:absolute;left:0;top:0;width:100%;border:0}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}#load .v{animation:spin 2.4s linear infinite!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <div class="logo" aria-hidden="true">V</div>
  <div><b>Mr V Enterprise</b><small>vandernoth.com</small></div>
  <div class="sp"></div>
  <button class="hbtn" id="hcompare">Compare plans</button>
  <button class="hbtn" id="hfaq">Help</button>
  <button class="hbtn" id="hordersb">My orders</button>
  <button class="hbtn" id="htheme" aria-label="Switch light or dark">🌙</button>
</header>
<div id="conn" style="max-width:1160px;margin:0 auto;padding:0 20px"></div>
<main id="app"></main>
<p class="mut small" style="text-align:center;margin:-50px 0 60px">Owner? <a href="/" style="color:var(--blue2);font-weight:700">Log in on the website</a> to see requests and give subscriptions.</p>
<div id="load" role="status" aria-label="Loading"><div class="v">V</div><b id="loadt">Loading…</b><div class="bar"><i></i></div></div>
<div id="modal" class="modal hide" role="dialog" aria-modal="true"></div>
<div id="toast" class="hide" role="status"></div>
<script>
/* =====================================================================
   Mr V Enterprise - buy page
   Flow: Plan > Length > Method > Details > Review > Order (pending > sent > received > claimed)
   Card numbers are NEVER typed here. Card payments go to a secure link set by Mr V.
   ===================================================================== */
const PR={e:{7:.99,30:2.99,90:6.99},p:{7:1.49,30:4.99,90:11.99}};
const NAME={e:'Enterprise',p:'Enterprise+'},ICON={e:'⭐',p:'👑'};
const FEAT={
  e:['All Mr V Enterprise features','Works on every device','Pick your own expiry date','Order updates in real time'],
  p:['Everything in Enterprise','Extra Enterprise+ features','Priority claim in Mr V\'s room','Crown badge on your plan']
};
const METH={envelope:'Envelope',cash:'Cash in person',card:'Card (secure link)'};
const SLOTS=[['morning','Morning','Before first class'],['lunch','Lunch','Midday break'],['after','After school','Last bell'],['any','Any time','Mr V decides']];
const STEPS=[['plan','Plan'],['length','Length'],['method','Pay with'],['details','Details'],['review','Review']];
const $=id=>document.getElementById(id);
const money=n=>'$'+n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={
  g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
  s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const KEY='mrv_buy_orders',NK='mrv_buy_notif',LK='mrv_buy_last',TK='mrv_buy_theme',ORDER_COOL=5,SITE='vandernoth.com';
const SESS=(()=>{try{return JSON.parse(localStorage.getItem('mrv_sess'))}catch(e){return null}})();
const SID=SESS&&SESS.role==='student'?SESS.id:'';
let FB='',PAYLINK='';

/* ---------- firebase (REST) ---------- */
let FBERR='';
async function fbConnect(){
  FB='';FBERR='';
  let url='';
  for(const u of ["firebase.txt","/firebase.txt","../firebase.txt",'https://vandernoth.com/firebase.txt']){
    try{const r=await fetch(u+'?'+Date.now(),{cache:'no-store'});if(!r.ok)continue;const x=(await r.text()).trim().split(/\s+/)[0];if(/^https?:\/\/\S+$/.test(x)&&!/YOUR/i.test(x)){url=x.replace(/\/+$/,'');break}}catch(e){}
  }
  if(!url){FBERR='nofile';return}
  try{
    const r=await fetch(url+'/cls.json',{cache:'no-store'});
    if(r.status===401||r.status===403){FBERR='perm';return}
    if(!r.ok){FBERR='http'+r.status;return}
    const c=await r.json();FB=url;
    if(c&&/^https:\/\/\S+$/.test(c.paylink||''))PAYLINK=c.paylink;
    /* a write test: orders must be writable too, or requests would never reach Mr V */
    const w=await fetch(url+'/orders/_ping.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:'{"t":'+Date.now()+'}'});
    if(!w.ok){FB='';FBERR=(w.status===401||w.status===403)?'perm':'http'+w.status;return}
    fetch(url+'/orders/_ping.json',{method:'DELETE'}).catch(()=>{});
  }catch(e){FB='';FBERR='net'}
}
let fbReady=fbConnect();
const fbPut=o=>fetch(FB+'/orders/'+o.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>{if(!r.ok)throw new Error('save')});
const fbGet=id=>fetch(FB+'/orders/'+id+'.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
const pub=o=>({id:o.id,sid:SID,role:SID?'student':'guest',name:o.name,plan:o.plan,days:o.days,total:o.total,method:o.method,
  slot:o.slot||'any',note:o.note||'',ipk:o.ipk||'',ipm:o.ipm||'',state:o.state==='claimed'?'given':o.state==='got'?'sent':o.state,ts:o.ts});

/* ---------- state ---------- */
let S={plan:'',dur:30,method:'',name:ls.g('mrv_buy_name',''),slot:'any',note:'',agree:false};
let view='plan',cur=null,busy=false,rev=false,filt='all';
const orders=()=>ls.g(KEY,[]);
/* IP fingerprint: only a scrambled hash and a masked IP (like 73.12.x.x) are saved, never the full IP */
async function ipInfo(){
  for(const u of ['https://api.ipify.org?format=json','https://api64.ipify.org?format=json']){
    try{const c=new AbortController();setTimeout(()=>c.abort(),3500);const r=await fetch(u,{signal:c.signal,cache:'no-store'}),j=await r.json();
      if(j&&j.ip){const ip=String(j.ip),m=/^\d+\.\d+\.\d+\.\d+$/.test(ip)?ip.split('.').slice(0,2).join('.')+'.x.x':ip.split(':').slice(0,2).join(':')+'::x';
        const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mrv-ip|'+ip));return{ipk:[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16),ipm:m}}}catch(e){}
  }
  return{ipk:'',ipm:''};
}
const code=()=>'MV-'+Math.random().toString(36).slice(2,6).toUpperCase();
const expDate=d=>new Date(Date.now()+d*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const price=()=>PR[S.plan][S.dur];
const monthly=(p,d)=>PR[p][d]/d*30;
const savePct=(p,d)=>Math.round((1-monthly(p,d)/PR[p][30])*100);
const STATE_TXT={pending:'Pending',sent:'Sent',got:'Received',claimed:'Claimed',cancelled:'Cancelled'};
const STATE_CLS={pending:'',sent:'s',got:'s',claimed:'c',cancelled:'x'};

/* ---------- the spinning V loader (on EVERYTHING) ---------- */
function withLoad(text,fn,ms){
  if(busy)return;busy=true;
  $('loadt').textContent=text||'Loading…';$('load').classList.add('on');
  setTimeout(()=>{
    Promise.resolve().then(fn).catch(()=>{}).finally(()=>setTimeout(()=>{$('load').classList.remove('on');busy=false},180));
  },ms||800);
}
const CD={};
function cool(k,ms){const n=Date.now();if(CD[k]&&n-CD[k]<ms)return false;CD[k]=n;return true}

/* ---------- toast, notify, confetti, copy ---------- */
function toast(t){
  const x=$('toast');x.classList.remove('hide');x.style.animation='none';x.offsetWidth;x.style.animation='';
  x.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add('hide'),4500);
}
function notify(t,b){
  if(ls.g(NK,'')==='on'&&window.Notification&&Notification.permission==='granted'){try{new Notification(t,{body:b||''})}catch(e){}}
  toast(t+(b?(/[!?.]$/.test(t)?' ':'. ')+b:''));
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<80;i++){
    const c=document.createElement('i');c.className='cf';
    c.style.cssText='left:'+Math.random()*100+'vw;background:hsl('+Math.floor(Math.random()*360)+',85%,60%);animation-duration:'+(1.6+Math.random()*1.6)+'s;animation-delay:'+Math.random()*.4+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
  }
}
function copyText(t){
  const done=()=>toast('Copied '+t);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(done);
  else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
}

/* ---------- connection status ---------- */
function connMsg(){
  return {nofile:'Mr V\'s data file (firebase.txt) was not found next to this page.',perm:'Mr V\'s database is refusing orders (permission denied). Its rules may have expired.',net:'Could not reach Mr V\'s database. Check your internet.'}[FBERR]||('Mr V\'s database answered with an error ('+FBERR+').');
}
function drawConn(){
  const c=$('conn');if(!c)return;
  c.innerHTML=FB?'':'<div class="warn" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px"><b>Not connected.</b> '+esc(connMsg())+' You can look around, but you can not place an order yet.</span><button class="btn sm light" id="retryc">Try again</button></div>';
}
/* ---------- theme ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;$('htheme').textContent=t==='dark'?'☀️':'🌙';ls.s(TK,t)}
setTheme(ls.g(TK,matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

/* ---------- modals ---------- */
function openModal(html,wide){
  const m=$('modal');m.innerHTML='<div class="box '+(wide?'wide':'')+'"><button class="x" data-close aria-label="Close">✕</button>'+html+'</div>';
  m.classList.remove('hide');const f=m.querySelector('button:not(.x),a');if(f)setTimeout(()=>f.focus(),60);
}
function closeModal(){$('modal').classList.add('hide');$('modal').innerHTML=''}
function askNotif(){
  openModal('<div style="text-align:center"><div class="bell" aria-hidden="true">🔔</div><h2 style="margin:8px 0">Turn on notifications?</h2>'+
  '<p class="mut">Let <b>'+SITE+'</b> send you a reminder when your order is coming or claimed.</p>'+
  '<p class="mut small">Optional. If you skip it, you will not get order updates, so check this page yourself.</p>'+
  '<button class="btn" id="nyes">Allow notifications</button><button class="btn light" id="nno" style="margin-top:10px">Not now</button></div>');
  $('modal').querySelector('.x').classList.add('hide');
}
function notifDone(v){closeModal();ls.s(NK,v);if(v!=='on')setTimeout(()=>toast('Notifications are off. You will not get order updates.'),400)}
function notifYes(){
  if(!window.Notification){notifDone('off');return}
  Notification.requestPermission().then(r=>{if(r==='granted'){notifDone('on');toast('Notifications are on. Thanks!')}else notifDone('off')}).catch(()=>notifDone('off'));
}
function compareModal(){
  const row=(l,a,b)=>'<tr><td>'+l+'</td><td>'+a+'</td><td>'+b+'</td></tr>';
  openModal('<h2>Compare plans</h2><table><tr><th></th><th>⭐ Enterprise</th><th>👑 Enterprise+</th></tr>'+
    row('7 days',money(PR.e[7]),money(PR.p[7]))+row('30 days <span class="chip">DEFAULT</span>',money(PR.e[30]),money(PR.p[30]))+row('90 days',money(PR.e[90]),money(PR.p[90]))+
    row('Per month at 90 days',money(monthly('e',90)),money(monthly('p',90)))+
    row('Enterprise features','✓','✓')+row('Extra Enterprise+ features','—','✓')+row('Priority claim','—','✓')+row('Crown badge','—','✓')+
    '</table><p class="mut small" style="margin-top:12px">You always pay once. No splitting, no automatic renewals.</p>',true);
}
function faqModal(){
  const q=(a,b)=>'<details class="faq"><summary>'+a+'</summary><p>'+b+'</p></details>';
  openModal('<h2>Help</h2>'+
    q('How long until I get my plan?','Usually 1 to 8 hours after Mr V gets your payment, often sooner. You can watch the status on your order page.')+
    q('Is it risky to pay in cash or an envelope?','No. Your order has a code. Mr V matches the code to your payment and marks the order given.')+
    q('Can I pay with a card?','Yes, when Mr V has switched it on. You pay on a secure payment page. This site never sees or stores your card number.')+
    q('Can I make more than one order?','Yes. There is no limit. There is a short wait of '+ORDER_COOL+' seconds between orders.')+
    q('What if I cancel or Mr V cancels?','Nothing is given and nothing is charged by this page. Ask Mr V about any money you already handed over.')+
    q('How do I get updates?','Turn on notifications when asked, or open My orders any time. The page checks for updates every few seconds.')+
    q('Where are my orders saved?','In this browser, plus a copy that Mr V can see so he can give your plan.'),true);
}
function receiptModal(o){
  openModal('<div class="receipt" id="rc"><h3>Mr V Enterprise</h3><div style="text-align:center">'+SITE+'</div><hr>'+
    '<div class="r"><span>Order</span><b>'+o.id+'</b></div><div class="r"><span>Name</span><span>'+esc(o.name)+'</span></div>'+
    '<div class="r"><span>Plan</span><span>'+NAME[o.plan]+'</span></div><div class="r"><span>Length</span><span>'+o.days+' days</span></div>'+
    '<div class="r"><span>Pay with</span><span>'+METH[o.method]+'</span></div><div class="r"><span>Date</span><span>'+new Date(o.ts).toLocaleString()+'</span></div><hr>'+
    '<div class="r"><b>Total</b><b>'+money(o.total)+'</b></div><div class="r"><span>Status</span><span>'+STATE_TXT[o.state]+'</span></div><hr>'+
    '<div style="text-align:center">Thanks for shopping with us.</div></div>'+
    '<div class="btnrow"><button class="btn light" data-copy="'+o.id+'">Copy code</button><button class="btn" id="printb">Print</button></div>');
}

/* ---------- reusable view pieces ---------- */
function stepper(cur){
  const i=STEPS.findIndex(s=>s[0]===cur);
  return '<div class="stepper" aria-label="Step '+(i+1)+' of '+STEPS.length+'">'+STEPS.map((s,n)=>
    '<div class="stp '+(n<i?'d jmp':n===i?'c':'')+'" '+(n<i?'data-jump="'+s[0]+'"':'')+'><i>'+(n<i?'✓':n+1)+'</i><span>'+s[1]+'</span></div>').join('')+'</div>';
}
const back=(to,l)=>'<button class="back" data-back="'+to+'">← '+l+'</button>';
function opt(a,v,ic,t,sub,right,cls,off,on){
  return '<button class="opt '+(cls||'')+(on?' on':'')+'" data-'+a+'="'+v+'"'+(off?' disabled':'')+'><span class="ic" aria-hidden="true">'+ic+'</span><span class="t"><b>'+t+'</b><span>'+sub+'</span></span>'+(right?'<span class="pr">'+right+'</span>':'')+'</button>';
}
function summary(){
  if(!S.plan)return '<div class="panel sum"><h3>Your order</h3><p class="empty">Pick a plan to start.</p></div>';
  const t=S.plan&&PR[S.plan][S.dur],sv=savePct(S.plan,S.dur);
  return '<div class="panel sum"><h3 style="margin-bottom:8px">Your order</h3>'+
    '<div class="row"><span>Plan</span><b>'+ICON[S.plan]+' '+NAME[S.plan]+'</b></div>'+
    '<div class="row"><span>Length</span><b>'+(view==='plan'?'—':S.dur+' days')+'</b></div>'+
    '<div class="row"><span>Expires</span><b>'+(view==='plan'?'—':expDate(S.dur))+'</b></div>'+
    '<div class="row"><span>Pay with</span><b>'+(S.method?METH[S.method]:'—')+'</b></div>'+
    (S.method&&view!=='plan'?'<div class="row"><span>Pickup time</span><b>'+(SLOTS.find(s=>s[0]===S.slot)||SLOTS[3])[1]+'</b></div>':'')+
    (sv>0&&view!=='plan'?'<div class="row"><span>You save</span><b class="save">'+sv+'% a month</b></div>':'')+
    '<div class="mut small" style="margin-top:12px">One payment</div><div class="big">'+(view==='plan'?'—':money(t))+'</div>'+
    '<p class="mut small" style="margin:6px 0 0">Prices are a single payment. No splitting.</p></div>';
}
function infoBox(){
  return '<div class="panel" style="margin-top:16px"><b>Safe and simple</b><ul class="mut small" style="margin:8px 0 0;padding-left:18px"><li>No card numbers are typed on this page.</li><li>Your order code proves your payment.</li><li>Plans are claimed in about 1 to 8 hours.</li></ul></div>';
}

/* ---------- the stages ---------- */
const V={
  plan(){
    const card=p=>'<button class="plan '+(p==='p'?'plus':'')+'" data-plan="'+p+'"><div class="ico" aria-hidden="true">'+ICON[p]+'</div><h2>'+NAME[p]+(p==='p'?' <span class="chip g">MORE</span>':'')+'</h2>'+
      '<div class="price">'+money(PR[p][30])+'<span class="mut small" style="font-weight:600"> / 30 days</span></div><div class="mut small">or '+money(PR[p][7])+' for 7 days · '+money(PR[p][90])+' for 90 days</div>'+
      '<ul>'+FEAT[p].map(f=>'<li>'+f+'</li>').join('')+'</ul><span class="go">Choose '+NAME[p]+'</span></button>';
    return '<div class="hero"><span class="kick">Mr V Enterprise</span><h1>Pick your subscription</h1><p class="mut">Choose a plan, then how long, then how to pay. Five easy steps.</p></div>'+stepper('plan')+
      '<div class="plans stagger">'+card('e')+card('p')+'</div>'+
      '<div class="btnrow"><button class="btn light" id="cmp">Compare plans side by side</button></div>';
  },
  length(){
    return back('plan','Change plan')+stepper('length')+'<div class="hero"><h1>How long?</h1><p class="mut">When should your '+NAME[S.plan]+' expire?</p></div><div class="opts stagger">'+
      [7,30,90].map(d=>{const sv=savePct(S.plan,d);return opt('dur',d,d===7?'📅':d===30?'🗓️':'📆',d+' days'+(d===30?' <span class="chip">DEFAULT</span>':'')+(sv>0?' <span class="chip b">SAVE '+sv+'%</span>':''),'Expires '+expDate(d)+' · '+money(monthly(S.plan,d))+' a month',money(PR[S.plan][d]),S.plan==='p'?'gold':'',false,S.dur===d)}).join('')+'</div>';
  },
  method(){
    return back('length','Change length')+stepper('method')+'<div class="hero"><h1>How will you pay?</h1><p class="mut">One payment of <b>'+money(price())+'</b>. Pick what is easiest.</p></div><div class="opts stagger">'+
      opt('m','envelope','✉️','Envelope <span class="chip">RECOMMENDED</span>','Put the money in an envelope and take it to Mr V\'s room.','',  '',false,S.method==='envelope')+
      opt('m','cash','💵','Cash in person','Hand your cash straight to Mr V.','','',false,S.method==='cash')+
      opt('m','card','💳','Credit or debit card',PAYLINK?'Pay on a secure card page. Your card info goes to the payment company, never to this site.':'Not set up yet. Ask Mr V to turn it on.','','',!PAYLINK,S.method==='card')+'</div>'+
      '<div class="info">All three work the same: you get an order code, pay once, and Mr V gives your plan.</div>';
  },
  details(){
    const m=S.method,slots=m==='card'?'':'<label class="lab">When will you hand it over?</label><div class="slots">'+SLOTS.map(s=>'<div class="slot '+(S.slot===s[0]?'on':'')+'" data-slot="'+s[0]+'" tabindex="0" role="button">'+s[1]+'<small>'+s[2]+'</small></div>').join('')+'</div>';
    return back('method','Change payment')+stepper('details')+'<div class="hero"><h1>A few details</h1><p class="mut">So Mr V knows who the order is from.</p></div><div class="panel">'+
      '<label class="lab" for="nm">Your name</label><input type="text" id="nm" maxlength="40" placeholder="First name and last initial" autocomplete="off" value="'+esc(S.name)+'">'+
      (SID?'<div class="good">You are logged in on the website. Your order will be linked to your account.</div>':'<div class="info">Not logged in. That is fine, just type your name clearly.</div>')+
      slots+'<label class="lab" for="nt">Note for Mr V <span class="mut" style="font-weight:500">(optional)</span></label><input type="text" id="nt" maxlength="80" placeholder="Anything he should know" value="'+esc(S.note)+'">'+
      '<button class="btn" id="tonext" style="margin-top:18px">Continue to review</button></div>';
  },
  review(){
    const t=price(),env=Math.ceil(t);
    return back('details','Change details')+stepper('review')+'<div class="hero"><h1>Check and pay</h1><p class="mut">Last step. Look it over.</p></div><div class="panel">'+
      '<table><tr><td class="mut">Plan</td><td><b>'+ICON[S.plan]+' '+NAME[S.plan]+'</b></td></tr><tr><td class="mut">Length</td><td><b>'+S.dur+' days</b> (expires '+expDate(S.dur)+')</td></tr>'+
      '<tr><td class="mut">Pay with</td><td><b>'+METH[S.method]+'</b></td></tr><tr><td class="mut">Name</td><td><b>'+esc(S.name)+'</b></td></tr>'+
      (S.method!=='card'?'<tr><td class="mut">Hand over</td><td><b>'+(SLOTS.find(s=>s[0]===S.slot)||SLOTS[3])[1]+'</b></td></tr>':'')+(S.note?'<tr><td class="mut">Note</td><td>'+esc(S.note)+'</td></tr>':'')+'</table>'+
      '<div class="mut small" style="margin-top:14px">Total, paid once</div><div class="big">'+money(t)+'</div>'+
      (S.method==='envelope'?'<div class="good">Put <b>$'+env+'</b> in your envelope (rounded up to a whole dollar).</div>':S.method==='cash'?'<div class="good">Bring <b>$'+env+'</b> in cash and hand it to Mr V.</div>':'<div class="good">A secure card page opens from your order. Pay <b>'+money(t)+'</b> there.</div>')+
      '<label class="check"><input type="checkbox" id="agree"'+(S.agree?' checked':'')+'><span>I checked my order. I understand I pay <b>once</b> and Mr V gives my plan after he gets it.</span></label>'+
      '<button class="btn '+(S.plan==='p'?'gold':'')+'" id="payb" disabled>Pay Mr V Enterprise<i class="cd" id="cdbar" style="width:0"></i></button><p class="small mut" id="cdtxt" style="text-align:center;margin:10px 0 0"></p></div>';
  }
};
const STG=[['pending','Pending'],['sent','Sent'],['got','Received'],['claimed','Claimed']];
function etaPct(o){
  if(o.state==='claimed')return 100;if(o.state==='cancelled')return 0;
  const base={pending:8,sent:40,got:75}[o.state]||8,mins=(Date.now()-o.ts)/6e4;
  return Math.min(95,Math.round(base+Math.min(20,mins/24)));
}
function timeline(o){
  const ev=[['Order placed',new Date(o.ts).toLocaleString(),'pending'],['You sent the payment','Press the button when you did','sent'],['Mr V received it','He is checking your code','got'],['Plan claimed','Your plan is on your account','claimed']];
  const cu=Math.max(0,STG.findIndex(s=>s[0]===o.state));
  return '<ul class="tl">'+ev.map((e,i)=>'<li class="'+(i<cu||o.state==='claimed'?'':i===cu?'now':'next')+'"><b>'+e[0]+'</b><small>'+e[1]+'</small></li>').join('')+'</ul>';
}
function order(o){
  const ok=o.state==='claimed',no=o.state==='cancelled',p=Math.ceil(o.total);
  const how=o.method==='envelope'?'<h2>Make your envelope</h2><div class="env"><div class="fl"></div><div class="seal">V</div><div class="lab">For Mr V · Room<br><b>$'+p+'</b>'+esc(o.name)+' · '+o.id+'</div></div><ol class="steps"><li>Put <b>$'+p+'</b> in an envelope.</li><li>Write your name and <b>'+o.id+'</b> on the front.</li><li>Take it to Mr V\'s room.</li><li>Press the button below.</li></ol>':
    o.method==='cash'?'<h2>Pay in cash</h2><ol class="steps"><li>Find Mr V and say your order code <b>'+o.id+'</b>.</li><li>Hand him <b>$'+p+'</b> in cash.</li><li>Press the button below.</li></ol>':
    '<h2>Pay by card</h2><ol class="steps"><li>Press <b>Open card payment</b>.</li><li>Pay <b>'+money(o.total)+'</b> on the secure page. Type <b>'+o.id+'</b> in the note box if it asks.</li><li>Come back and press the button below.</li></ol>'+(PAYLINK?'<a class="btn" style="margin-bottom:10px" href="'+esc(PAYLINK)+'" target="_blank" rel="noopener">Open card payment</a>':'');
  return back('history','All orders')+'<div class="shell"><div><div class="pend '+(ok?'ok':no?'no':'')+'"><div class="ck" aria-hidden="true">'+(ok?'✓':no?'✕':'⏳')+'</div>'+
    '<h1 style="font-size:2rem;margin:0 0 6px">'+(ok?'Plan claimed!':no?'Order cancelled':'Payment pending')+'</h1>'+
    '<p style="margin:0"><b>'+(ok?'Enjoy '+NAME[o.plan]+'!':no?'Mr V cancelled this order. Nothing was given.':'Thanks for shopping with us.')+'</b></p>'+
    '<p class="mut small" style="margin:6px 0 0">'+ICON[o.plan]+' '+NAME[o.plan]+' · '+o.days+' days · '+money(o.total)+'</p></div>'+
    '<div class="codebox"><span class="mut small">Order code</span><b>'+o.id+'</b><button class="btn light sm" data-copy="'+o.id+'">Copy</button></div>'+
    (no?'':'<div class="panel" style="margin-top:14px"><b>Progress</b><div class="eta" aria-hidden="true"><i style="width:'+etaPct(o)+'%"></i></div>'+timeline(o)+
    (ok?'':'<p class="mut small" style="margin:0">Your plan is claimed about 1 to 8 hours after Mr V gets your payment, or sooner.</p>')+'</div>')+
    (FB?'':'<div class="warn">Offline: this order is saved on this device only, so Mr V can not see it yet.</div>')+'</div>'+
    '<div class="side"><div class="panel">'+(no?'<h2>This order was cancelled</h2><p class="mut">You can order again any time.</p>':ok?'<h2>All done</h2><p class="mut">Your plan expires on <b>'+expDate(o.days)+'</b>.</p>':how+
    '<button class="btn" id="sentb" data-id="'+o.id+'"'+(o.state!=='pending'?' disabled':'')+'>'+(o.state==='pending'?'I sent my payment':'Payment marked as sent')+'</button>')+
    '<div class="btnrow"><button class="btn light" data-receipt="'+o.id+'">Receipt</button><button class="btn light" id="again">Buy another</button></div></div></div></div>';
}
function history(){
  const all=orders(),L=all.filter(o=>filt==='all'||(filt==='open'?!['claimed','cancelled'].includes(o.state):o.state===filt));
  const spent=all.filter(o=>o.state==='claimed').reduce((a,o)=>a+o.total,0),open=all.filter(o=>!['claimed','cancelled'].includes(o.state)).length;
  return '<div class="hero"><span class="kick">History</span><h1>My orders</h1><p class="mut small">Saved in this browser. Make as many as you like.</p></div>'+
    '<div class="stats"><div class="stat"><b>'+all.length+'</b><small>Orders</small></div><div class="stat"><b>'+open+'</b><small>Waiting</small></div><div class="stat"><b>'+money(spent)+'</b><small>Claimed value</small></div></div>'+
    '<div class="chips">'+[['all','All'],['open','Waiting'],['claimed','Claimed'],['cancelled','Cancelled']].map(f=>'<button class="fchip '+(filt===f[0]?'on':'')+'" data-filt="'+f[0]+'">'+f[1]+'</button>').join('')+'</div>'+
    (L.length?L.map(o=>'<div class="ocard" data-open="'+o.id+'" tabindex="0" role="button"><div><b>'+ICON[o.plan]+' '+NAME[o.plan]+' · '+o.days+' days</b><div class="mut small">'+o.id+' · '+METH[o.method]+' · '+new Date(o.ts).toLocaleDateString()+'</div></div><div style="text-align:right"><b>'+money(o.total)+'</b><br><span class="pill2 '+STATE_CLS[o.state]+'">'+STATE_TXT[o.state]+'</span></div></div>').join(''):'<p class="empty" style="padding:30px 0">No orders here yet.</p>')+
    '<div class="btnrow"><button class="btn" id="again">Browse plans</button></div>';
}

/* ---------- drawing + navigation ---------- */
const FLOWV=['plan','length','method','details','review'];
function draw(){
  drawConn();
  const flow=FLOWV.includes(view),inner=view==='order'?order(cur):view==='history'?history():V[view]();
  $('app').innerHTML='<div class="page '+(rev?'rev':'')+'">'+(flow?'<div class="shell"><div>'+inner+'</div><div class="side">'+summary()+infoBox()+'</div></div>':inner)+'</div>';
  rev=false;scrollTo(0,0);
  if(view==='review')cdTick();
  if(view==='details'&&$('nm')&&!S.name)$('nm').focus();
}
function nav(v,text,fn,bk){withLoad(text,()=>{if(fn)fn();view=v;rev=!!bk;draw()},700)}
function cdLeft(){return Math.max(0,Math.ceil(ORDER_COOL-(Date.now()-ls.g(LK,0))/1000))}
function cdTick(){
  clearTimeout(cdTick.t);const b=$('payb');if(!b)return;const l=cdLeft(),ag=$('agree')&&$('agree').checked;
  b.disabled=l>0||!ag;$('cdbar').style.width=(l>0?l/ORDER_COOL*100:0)+'%';
  $('cdtxt').textContent=l>0?'Please wait '+l+' seconds before another order.':ag?'':'Tick the box to continue.';
  if(l>0)cdTick.t=setTimeout(cdTick,1000);
}
function upd(id,text,fn){const L=orders(),o=L.find(x=>x.id===id);if(!o)return;withLoad(text,async()=>{await fn(o);ls.s(KEY,L);cur=o;draw()},800)}
function reset(){S.plan='';S.dur=30;S.method='';S.slot='any';S.note='';S.agree=false}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if(t.id==='nyes'){if(!busy&&cool('n',800))withLoad('Asking your browser…',notifYes,600);return}
  if(t.id==='nno'){if(!busy&&cool('n',800))withLoad('Saving…',()=>notifDone('off'),500);return}
  if(t.closest('[data-close]')||t===$('modal')){closeModal();return}
  if(b=t.closest('[data-copy]')){copyText(b.dataset.copy);return}
  if(t.id==='printb'){window.print();return}
  if(busy)return;
  if(b=t.closest('[data-receipt]')){const o=orders().find(x=>x.id===b.dataset.receipt);if(o)receiptModal(o);return}
  if(b=t.closest('[data-filt]')){filt=b.dataset.filt;draw();return}
  if(b=t.closest('[data-plan]')){if(cool('s',900))nav('length','Next…',()=>{if(S.plan!==b.dataset.plan)S.method='';S.plan=b.dataset.plan});return}
  if(b=t.closest('[data-dur]')){if(cool('s',900))nav('method','Next…',()=>{S.dur=+b.dataset.dur});return}
  if(b=t.closest('[data-m]')){if(cool('s',900))nav('details','Next…',()=>{S.method=b.dataset.m});return}
  if(b=t.closest('[data-slot]')){S.slot=b.dataset.slot;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('on',x===b));return}
  if(b=t.closest('[data-back]')){if(cool('s',900))nav(b.dataset.back,'Going back…',null,true);return}
  if(b=t.closest('[data-jump]')){if(cool('s',900))nav(b.dataset.jump,'Going back…',null,true);return}
  if(t.id==='tonext'){
    const n=$('nm').value.trim();S.name=n;S.note=$('nt').value.trim();
    if(!n){$('nm').focus();toast('Type your name first.');return}
    if(cool('s',900)){ls.s('mrv_buy_name',n);nav('review','Next…')}return}
  if(t.id==='agree'){S.agree=t.checked;cdTick();return}
  if(t.id==='cmp'){compareModal();return}
  if(t.id==='retryc'){if(cool('rc',2000)){fbReady=fbConnect();withLoad('Connecting to Mr V…',async()=>{await fbReady;draw();toast(FB?'Connected!':connMsg())},900)}return}
  if(t.id==='payb'){
    if(!$('agree').checked){toast('Tick the box first.');return}
    if(!FB){toast('Not connected to Mr V yet, so the order would be lost. Press Try again at the top.');return}
    if(cdLeft()>0||!cool('pay',3000))return;
    const o={id:code(),name:S.name,plan:S.plan,days:S.dur,total:price(),method:S.method,slot:S.slot,note:S.note,ts:Date.now(),state:'pending'};
    const prev=ls.g(LK,0);ls.s(LK,Date.now());
    withLoad('Paying Mr V Enterprise…',async()=>{
      await fbReady;Object.assign(o,await ipInfo());
      if(FB){try{await fbPut(pub(o))}catch(err){ls.s(LK,prev);toast('Could not send your order to Mr V. Check your internet and try again.');return}}
      const L=orders();L.unshift(o);ls.s(KEY,L);cur=o;view='order';reset();draw();
      notify('Payment pending','Thanks for shopping with us. Order '+o.id)
    },2400);return}
  if(t.id==='again'){if(cool('ag',900)){reset();nav('plan','Loading plans…')}return}
  if(b=t.closest('[data-open]')){const o=orders().find(x=>x.id===b.dataset.open);if(o&&cool('op',900))nav('order','Opening order…',()=>{cur=o});return}
  if(t.id==='sentb'){if(cool('sent',3000))upd(t.dataset.id,'Telling Mr V…',async o=>{
      o.state='sent';o.dirty=true;
      if(!FB){fbReady=fbConnect();await fbReady}
      if(FB){try{await fbPut(pub(o));o.dirty=false;notify('Payment marked as sent','Mr V can see it now.')}catch(err){toast('Saved here. I will keep trying to tell Mr V.')}}
      else toast('Saved here, but Mr V can not be reached yet. I will keep trying: '+connMsg());
    });return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.target.id==='nm'||e.target.id==='nt')&&$('tonext'))$('tonext').click();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.slot,.ocard')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&!$('modal').classList.contains('hide')){$('nno')?$('nno').click():closeModal()}
});
document.addEventListener('input',e=>{if(e.target.id==='nm')S.name=e.target.value;if(e.target.id==='nt')S.note=e.target.value});
$('hordersb').onclick=()=>{if(!busy&&cool('ob',900))nav('history','Loading your orders…')};
$('hcompare').onclick=()=>{if(!busy)compareModal()};
$('hfaq').onclick=()=>{if(!busy)faqModal()};
$('htheme').onclick=()=>{if(!busy&&cool('th',500))withLoad('Switching theme…',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'),500)};

/* ---------- live sync with Mr V's website ---------- */
async function syncOrders(){
  await fbReady;if(!FB&&!busy&&cool('recon',20000)){fbReady=fbConnect();await fbReady;drawConn()}
  if(!FB||busy)return;const L=orders();let ch=false;
  for(const o of L){if(o.dirty){try{await fbPut(pub(o));o.dirty=false;ch=true}catch(e){}}}
  for(const o of L){
    if(o.state==='claimed'||o.state==='cancelled')continue;
    try{
      const r=await fbGet(o.id);if(!r)continue;
      if(r.state==='given'){o.state='claimed';ch=true;notify('Plan claimed!',NAME[o.plan]+' is yours for '+o.days+' days.');setTimeout(confetti,400)}
      else if(r.state==='cancelled'){o.state='cancelled';ch=true;notify('Order cancelled','Mr V cancelled order '+o.id)}
      else if(r.state==='sent'&&o.state==='pending'){o.state='sent';ch=true}
    }catch(e){}
  }
  if(ch){ls.s(KEY,L);if(view==='order'&&cur){cur=L.find(x=>x.id===cur.id)||cur;draw()}else if(view==='history')draw()}
}
setInterval(syncOrders,6000);
setInterval(()=>{if(view==='order'&&cur&&!busy){const e=document.querySelector('.eta i');if(e)e.style.width=etaPct(cur)+'%'}},30000);

/* ---------- start ---------- */
withLoad('Loading Mr V Enterprise…',async()=>{await fbReady;draw();if(!ls.g(NK,''))setTimeout(askNotif,500)},1000);
</script>
</body>
</html>
