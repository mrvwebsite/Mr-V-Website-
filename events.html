function hostPanels(e,s,alive,force){

/* ---------- audio ---------- */
function playSong(url){stopSong();if(!url)return;AUDIO=new Audio(url);AUDIO.loop=true;AUDIO.volume=VOL;AUDIO.play().catch(()=>toast('This song could not play. Check the link or try another song.'))}
